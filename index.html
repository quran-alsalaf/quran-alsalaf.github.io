<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover ليمتد المصحف حافةً إلى حافة تحت النتوء والحواف المنحنية -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="إنشاء: سامي أبصار الإسلام" />

    <!-- تشغيل بملء الشاشة عند التثبيت على آيفون -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="قرآن السلف" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/favicon-64.png" />

    <title>تطبيق قرآن السلف</title>

    <script>
      /*
        يُطبَّق وضع العرض قبل رسم الصفحة، لئلا تومض بلونٍ ثم تنقلب إلى آخر.
        ولهذا هو هنا مكتوبًا داخل الصفحة، لا في ملف يُحمَّل بعدها.

        القاعدة (بطلب صاحب المشروع):
          • الخياران فاتح وداكن فقط، بلا خيار ثالث يتبع النظام.
          • عند أول فتحة على الإطلاق فقط، يُنظر إلى إعداد نظام الجهاز
            فيُتَّخذ وضعًا افتدائيًّا، ثم يُحفظ فورًا.
          • بعدها يبقى اختيار المستخدم هو المعتمد دائمًا، ولو تغيّر
            إعداد النظام — فالمتابعة التلقائية تقع مرة واحدة لا باستمرار.
      */
      (function () {
        var KEY = 'hq.theme';
        var theme;
        try {
          theme = localStorage.getItem(KEY);
        } catch (e) {}

        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
          try {
            localStorage.setItem(KEY, theme);
          } catch (e) {}
        }

        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
      /* قبل أن يرسم React شيئًا: كحلي بلون شاشة النظام، فلا يومض الأبيض بينها وبين التطبيق */
      #root:empty { position: fixed; inset: 0; background: #1a0165; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
